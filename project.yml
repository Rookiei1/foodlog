name: FoodLog
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    FOODLOG_PROFILE: "match AppStore com.rookiei1.foodlog"
targets:
  FoodLog:
    type: application
    platform: iOS
    sources:
      - path: FoodLog
    info:
      path: FoodLog/Info.plist
      properties:
        CFBundleDisplayName: 食刻
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 食刻需要使用相机拍摄您的餐食或包装营养成分表，以便记录饮食并在您授权后调用已配置的 AI 模型估算营养成分。
        NSPhotoLibraryUsageDescription: 食刻需要访问相册以选择您的餐食照片或营养成分表图片，用于饮食记录与营养分析。
        NSPhotoLibraryAddUsageDescription: 食刻需要保存导出的图表或饮食报告图片到相册。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rookiei1.foodlog
        PRODUCT_NAME: FoodLog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 食刻
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: 食刻需要使用相机拍摄您的餐食或包装营养成分表，以便记录饮食并在您授权后调用已配置的 AI 模型估算营养成分。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 食刻需要访问相册以选择您的餐食照片或营养成分表图片，用于饮食记录与营养分析。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 食刻需要保存导出的图表或饮食报告图片到相册。
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
        SKIP_INSTALL: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "$(FOODLOG_PROFILE)"
    scheme:
      gatherCoverageData: false
      testTargets:
        - FoodLogTests
        - FoodLogUITests
  FoodLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FoodLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rookiei1.foodlog.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  FoodLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FoodLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rookiei1.foodlog.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: FoodLog
